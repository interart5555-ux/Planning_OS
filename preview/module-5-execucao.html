<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Execução de trabalho · AppOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --green:#17643e; --green-h:#0f4f30; --green-soft:#e9f4ee; --green-line:#cde5d6;
    --ink:#15181c; --ink-2:#3d444d; --mute:#6b7280; --faint:#9aa1ab;
    --line:#e6e8ec; --line-2:#d3d8de; --sunk:#f6f7f8; --surface:#ffffff; --ground:#e9ecef;
    --info-bg:#edf3fb; --info-line:#d5e2f3; --info-fg:#2a5592;
    --warn-bg:#fffaf0; --warn-line:#f3dfae; --warn-fg:#80570a;
    /* Estados (vista da colaboradora) */
    --plan-bg:#fdf3c8; --plan-line:#f1dc8a; --plan-fg:#5b4506; --plan-dot:#e0b632;
    --conf-bg:#ffffff; --conf-line:#d3d8de; --conf-fg:#15181c; --conf-dot:#17643e;
    --prog-bg:#e3eefb; --prog-line:#bcd3ef; --prog-fg:#1f4d85; --prog-dot:#3b7fd0;
    --done-bg:#e8f5ed; --done-line:#bfe0cb; --done-fg:#17643e; --done-dot:#3c9a66;
    --bad-bg:#fde8e6; --bad-line:#f4c3bd; --bad-fg:#9b2318; --bad-dot:#d9463b;
    --sh:0 1px 2px rgba(17,24,39,.04), 0 8px 24px -16px rgba(17,24,39,.22);
    --sh-pop:0 18px 50px -18px rgba(17,24,39,.38), 0 2px 6px rgba(17,24,39,.06);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 "Public Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .i{width:20px;height:20px;flex:none}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}

  /* ---------- pré-visualização ---------- */
  .shell{display:flex;flex-direction:column;height:100dvh}
  .chrome{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:14px}
  .chrome h2{margin:0 auto 0 0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .chrome label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
  .chrome select{border:1px solid var(--line-2);border-radius:999px;background:var(--surface);padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--ink)}
  .seg{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;font-size:12.5px;font-weight:500;color:var(--ink-2);padding:6px 12px;border-radius:999px;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.14)}
  .seg.netseg button[aria-pressed="true"][data-net="off"]{background:var(--bad-bg);color:var(--bad-fg)}
  .chrome .reset{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:16px}
  .device{position:relative;width:100%;max-width:1200px;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);container:app / inline-size;transition:max-width .25s ease}
  .stage[data-w="390"] .device{max-width:390px;max-height:844px;border-radius:26px}
  .stage[data-w="820"] .device{max-width:820px;max-height:1180px;border-radius:20px}
  .layer{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .layer>*{pointer-events:auto}
  @media (max-width:700px){ .stage{padding:0} .device{border:0;border-radius:0!important;max-height:none!important} .chrome .w-seg{display:none} .chrome h2{flex-basis:100%} }

  /* ---------- estrutura da app ---------- */
  .app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
  .appbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .logo{font-weight:700;font-size:21px;letter-spacing:-.035em;color:var(--green)}
  .chip-app{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:12.5px;font-weight:600;white-space:nowrap}
  .ab-right{display:flex;align-items:center;gap:8px}
  .av{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:600}
  .net{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
  .net .i{width:17px;height:17px}
  .net.on .i{color:var(--green)}
  .net.off{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-fg)}
  .net.sync{background:var(--info-bg);border-color:var(--info-line);color:var(--info-fg)}
  .net.sync .i{animation:spin 1s linear infinite}
  .net b{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad-fg);color:#fff;font-size:11px}
  @container app (max-width:359px){ .net .lbl{display:none} }
  .offline{flex:none;display:flex;align-items:center;gap:10px;padding-block:9px;padding-inline:16px;background:var(--bad-bg);color:var(--bad-fg);font-size:13.5px;border-bottom:1px solid var(--bad-line)}
  .offline .i{width:18px;height:18px}
  .offline span{flex:1;min-width:0}

  .panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
  .pane{min-height:0;display:flex;flex-direction:column;min-width:0}
  .scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
  .pad{padding-block:18px 28px;padding-inline:16px;max-width:680px;margin:0 auto}
  .panes:not(.single)[data-screen="list"] .pane.main{display:none}
  .panes:not(.single):not([data-screen="list"]) .pane.list{display:none}
  @container app (min-width:720px){
    .panes:not(.single){grid-template-columns:minmax(330px,380px) minmax(0,1fr)}
    .panes:not(.single) .pane.list,.panes:not(.single) .pane.main{display:flex!important}
    .pane.list{border-right:1px solid var(--line);background:#fcfcfb}
    .pad{padding-inline:24px}
  }
  .empty-main{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px}
  .empty-main .i{width:40px;height:40px;color:var(--faint);margin-bottom:8px}

  .tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border:0;background:none;color:var(--mute);font-size:12.5px;font-weight:500;position:relative}
  .tabbar button .i{width:23px;height:23px}
  .tabbar button[aria-current="page"]{color:var(--green);font-weight:700}
  .tabbar .dotn{position:absolute;top:9px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad-fg);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}

  /* ---------- tipografia e botões ---------- */
  h1{margin:0;font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
  h1:focus{outline:none}
  h2.sec{margin:22px 0 10px;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h2.sec small{font-size:13px;font-weight:500;color:var(--mute)}
  h2.sec .opt{font-weight:400;color:var(--mute);font-size:14px}
  .sub{margin:4px 0 0;color:var(--ink-2)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-size:15.5px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-h)}
  .btn-outline{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
  .btn-outline:hover{border-color:var(--faint)}
  .btn-soft{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
  .btn-danger{background:var(--surface);border-color:var(--bad-line);color:var(--bad-fg)}
  .btn-block{display:flex;width:100%}
  .btn-lg{min-height:56px;font-size:17px;border-radius:13px}
  .btn[disabled]{opacity:.5;cursor:default}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin:-6px 0 6px -8px;padding:0 10px 0 4px;border:0;border-radius:10px;background:none;color:var(--ink-2);font-size:15px;font-weight:500}
  .back:hover{background:var(--sunk)}
  .back .i{width:22px;height:22px}

  /* ---------- estados ---------- */
  .st-planned{--bg:var(--plan-bg);--ln:var(--plan-line);--fg:var(--plan-fg);--dot:var(--plan-dot)}
  .st-confirmed{--bg:var(--conf-bg);--ln:var(--conf-line);--fg:var(--conf-fg);--dot:var(--conf-dot)}
  .st-in_progress{--bg:var(--prog-bg);--ln:var(--prog-line);--fg:var(--prog-fg);--dot:var(--prog-dot)}
  .st-done{--bg:var(--done-bg);--ln:var(--done-line);--fg:var(--done-fg);--dot:var(--done-dot)}
  .st-absence,.st-late{--bg:var(--bad-bg);--ln:var(--bad-line);--fg:var(--bad-fg);--dot:var(--bad-dot)}
  .pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.75);color:var(--fg)}
  .pill .i{width:16px;height:16px}
  .pill.solid{background:var(--bg);border:1px solid var(--ln)}
  .st-planned .pill:not(.solid){background:#f6de7c;color:#4a3804}
  .st-confirmed .pill,.st-confirmed .pill.solid{background:var(--green);border-color:var(--green);color:#fff}

  /* ---------- O meu dia ---------- */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
  .week button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-2);padding:0}
  .week button small{font-size:12px;color:var(--mute)}
  .week button b{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .week button.today{border-color:var(--green-line);box-shadow:inset 0 -3px 0 var(--green-line)}
  .week button[aria-pressed="true"]{background:var(--green);border-color:var(--green);box-shadow:none}
  .week button[aria-pressed="true"] small,.week button[aria-pressed="true"] b{color:#fff}
  .week button i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--green)}
  .week button[aria-pressed="true"] i{background:#fff}
  .summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;font-size:14px;color:var(--ink-2)}
  .summary b{font-weight:600;color:var(--ink)}
  .summary .tag{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 9px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .summary .tag.warn{background:var(--plan-bg);color:var(--plan-fg)}
  .summary .tag.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .summary .tag.ok{background:var(--done-bg);color:var(--done-fg)}

  .tl{list-style:none;margin:18px 0 0;padding:0}
  .tl li{position:relative;display:grid;grid-template-columns:50px 18px minmax(0,1fr);column-gap:6px;padding-bottom:14px}
  .tl li:not(:last-child)::before{content:"";position:absolute;left:64px;top:22px;bottom:-2px;width:2px;background:var(--line)}
  .tl .time{padding-top:13px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .tl .dot{position:relative;z-index:1;width:14px;height:14px;margin-top:17px;margin-left:1px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px var(--surface)}
  .tl .free{grid-column:1 / -1;padding:24px 16px;border:1px dashed var(--line-2);border-radius:14px;text-align:center;color:var(--mute)}

  .card{position:relative;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--fg);padding:13px 14px;min-width:0}
  .card .hit{position:absolute;inset:0;z-index:1;border:0;border-radius:inherit;background:transparent}
  .card .hit:focus-visible{outline-offset:3px}
  .card:has(.hit):hover{box-shadow:0 6px 18px -10px rgba(17,24,39,.35)}
  .card .top{display:flex;align-items:flex-start;gap:8px}
  .card h3{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;line-height:1.3;color:inherit}
  .card .chev{width:20px;height:20px;margin-top:2px;opacity:.7}
  .card .meta{margin-top:3px;font-size:14.5px;font-variant-numeric:tabular-nums;opacity:.92}
  .card .team{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13.5px;opacity:.85;min-width:0}
  .card .team .i{width:15px;height:15px}
  .card .team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .card .cta{position:relative;z-index:2;margin-top:12px}
  .card .live{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .card .live .i{width:17px;height:17px}
  .card.flag{box-shadow:inset 5px 0 0 var(--bad-dot);padding-left:18px}
  .flagb{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 9px;border-radius:999px;background:#fff;color:var(--bad-fg);font-size:12.5px;font-weight:700;border:1px solid var(--bad-line)}
  .flagb .i{width:15px;height:15px}
  .synct{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.8);color:var(--info-fg);font-size:12.5px;font-weight:600}
  .st-confirmed .synct{background:var(--info-bg)}
  .synct .i{width:15px;height:15px}
  .late-note{margin-top:6px;font-size:13.5px;font-weight:600}

  /* ---------- detalhe ---------- */
  .d-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px}
  .d-head h1{flex:1 1 240px}
  .info{margin:18px 0 0;display:flex;flex-direction:column;gap:14px}
  .info div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
  .info .i{width:23px;height:23px;color:var(--ink-2);margin-top:1px}
  .info dt{font-size:13px;font-weight:600;color:var(--ink)}
  .info dd{margin:0;color:var(--ink-2)}
  .maps{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;margin-top:16px;padding:0 14px;border:1px solid var(--green-line);border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:600;text-align:left}
  .maps span{flex:1}
  .note-box{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid var(--warn-line);color:#5d4308;font-size:14px}
  .note-box b{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:13px}
  .note-box b .i{width:16px;height:16px}
  hr.sep{border:0;border-top:1px solid var(--line);margin:20px 0 0}

  .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .chk{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:15px}
  .chk input{appearance:none;-webkit-appearance:none;flex:none;display:grid;place-items:center;width:24px;height:24px;margin:0;border:2px solid #b9c0c8;border-radius:6px;background:#fff;cursor:pointer}
  .chk input:checked{background:var(--green);border-color:var(--green)}
  .chk input:checked::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .chk input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .chk:has(input:checked){border-color:var(--green-line)}
  .chk.done-row span{color:var(--ink-2)}
  .chk.missing{border-color:var(--warn-line);background:var(--warn-bg)}
  .checks.compact .chk{min-height:44px;font-size:14.5px}

  .notice{display:flex;gap:10px;margin-top:12px;padding:11px 13px;border-radius:12px;border:1px solid;font-size:14px}
  .notice .i{width:19px;height:19px;margin-top:1px}
  .notice b{display:block;font-weight:600}
  .notice.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-fg)}
  .notice.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-fg)}
  .notice.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-fg)}
  .notice.ok{background:var(--done-bg);border-color:var(--done-line);color:var(--done-fg)}
  .link-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:12px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;text-align:left}
  .link-row .i:first-child{color:var(--bad-fg)}
  .link-row span{flex:1}
  .link-row:hover{border-color:var(--line-2)}

  .issues{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .issues li{display:flex;gap:10px;padding:11px 13px;border-radius:12px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-fg);font-size:14px}
  .issues .i{width:19px;height:19px;margin-top:1px}
  .issues b{display:block;font-weight:700}
  .issues p{margin:1px 0 0;color:#6e1c14}
  .issues small{display:block;margin-top:3px;font-size:12.5px;opacity:.85}

  .hist{list-style:none;margin:0;padding:0 0 0 4px}
  .hist li{position:relative;padding:0 0 12px 20px;font-size:14px;color:var(--ink-2)}
  .hist li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
  .hist li.bad::before{background:var(--bad-dot)}
  .hist li.ok::before{background:var(--done-dot)}
  .hist li:not(:last-child)::after{content:"";position:absolute;left:3px;top:17px;bottom:1px;width:2px;background:var(--line)}
  .hist time{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:6px}
  .hist .pend{display:inline-flex;align-items:center;gap:4px;margin-left:6px;color:var(--info-fg);font-size:12.5px;font-weight:600}
  .hist .pend .i{width:14px;height:14px}

  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
  .stats div{padding:10px 12px;border-radius:12px;background:var(--sunk)}
  .stats small{display:block;font-size:12.5px;color:var(--mute)}
  .stats b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- em curso ---------- */
  .run-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .timer{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .timer .i{width:26px;height:26px}
  .progress{height:12px;margin-top:16px;border-radius:999px;background:#e9ecef;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:999px;background:var(--green);transition:width .25s ease}
  .progress-l{margin-top:6px;text-align:right;font-size:13.5px;color:var(--ink-2)}
  .qty{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .qty li{display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 10px 6px 14px}
  .qty li+li{border-top:1px solid var(--line)}
  .qty .i.q-ico{width:22px;height:22px;color:var(--ink-2)}

  .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 32px));background:var(--surface);border-radius:16px;box-shadow:var(--sh-pop);padding:20px;animation:pop .18s ease}

  @keyframes rise{from{transform:translateY(40px);opacity:0}}

  @keyframes up{from{opacity:0;translate:0 10px}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      h += '<button type="button" class="btn btn-primary btn-block btn-lg" style="margin-top:12px" data-act="start" data-id="' + j.id + '">' + ic('play') + esc(A.start) + '</button>' +
        '<div class="notice info">' + ic('info') + '<span>' + (FEATURES.timer ? 'Ao iniciar, o estado passa para Em curso e o tempo começa a ser contabilizado.' : 'Ao iniciar, o estado passa para Em curso e fica registada a hora de início.') + '</span></div>';

    h += '<div class="notice info" style="margin-top:18px">' + ic('timer') + '<span><b>Em curso desde as ' + hhmm(j.startedAt) + '</b>' + (FEATURES.timer ? '<span data-timer="' + j.id + '">' + clockTxt(elapsed(j)) + '</span> · ' : '') + doneCount(j.tasks) + ' de ' + j.tasks.length + ' tarefas</span></div>' +
      '<button type="button" class="btn btn-primary btn-block btn-lg" style="margin-top:12px" data-act="run" data-id="' + j.id + '">' + ic('play') + esc(A.resume) + '</button>';
  } else if (j.status === 'done'){
    var diff = j.qtySaved && j.qtyConf ? A.qty.items.filter(function(it){ return j.qtySaved[it[0]] !== j.qtyConf[it[0]]; }).map(function(it){ var d = j.qtySaved[it[0]] - j.qtyConf[it[0]]; return (d > 0 ? '+' : '−') + Math.abs(d) + ' ' + it[1]; }) : [];

      '<div class="stats"><div><small>Início e fim</small><b>' + hhmm(j.startedAt) + ' – ' + hhmm(j.finishedAt) + '</b></div>' + (FEATURES.timer ? '<div><small>Tempo registado</small><b>' + clockTxt(j.durationSec) + '</b></div>' : '<div><small>Avisos</small><b>' + j.issues.length + '</b></div>') +

      (j.qtyConf ? '<div class="sum-line">' + ic('list') + '<span>' + esc(A.qty.title) + ': ' + (diff.length ? 'diferença registada (' + esc(diff.join(', ')) + ')' : 'quantidades confirmadas') + '</span></div>' : '') +

/* ---------- Em curso ---------- */
function qtySection(j){
  if (!j.qtyConf) return '';
  var diff = qtyDiff(j), savedNow = sameQty(j.qty, j.qtySaved);
  var h = '<h2 class="sec">' + esc(A.qty.title) + '</h2>' +
    '<p class="sub" style="margin:-4px 0 10px;font-size:13.5px">' + esc(A.qty.note) + '</p><ul class="qty">';
  A.qty.items.forEach(function(it){
    var k = it[0], v = j.qty[k], c = j.qtyConf[k];
    h += '<li>' + ic(it[2], 'q-ico') + '<span class="q-l">' + esc(it[1]) + (v !== c ? '<small class="diff">Configurado: ' + c + ' (' + (v > c ? '+' : '−') + Math.abs(v - c) + ')</small>' : '') + '</span>' +
      '<span class="stepper"><button type="button" id="q-' + k + '-m" data-act="qty" data-id="' + j.id + '" data-k="' + k + '" data-d="-1" aria-label="Menos ' + esc(it[1]) + '"' + (v <= 0 ? ' disabled' : '') + '>' + ic('minus') + '</button>' +
      '<output aria-live="polite" aria-label="' + esc(it[1]) + '">' + v + '</output>' +
      '<button type="button" id="q-' + k + '-p" data-act="qty" data-id="' + j.id + '" data-k="' + k + '" data-d="1" aria-label="Mais ' + esc(it[1]) + '">' + ic('plus') + '</button></span></li>';
  });
  h += '</ul>';
  if (savedNow) h += '<div class="notice ok">' + ic('checkc') + '<span>' + (diff.length ? 'Diferença registada: ' + esc(diff.join(', ')) + '.' : 'Quantidades confirmadas, sem diferenças.') + '</span></div>';
  else h += '<button type="button" id="qsave" class="btn btn-soft btn-block" style="margin-top:12px" data-act="qty-save" data-id="' + j.id + '">' + ic('list') + (diff.length ? 'Registar diferença' : 'Confirmar quantidades') + '</button>';
  return h;
}
function runPane(j){
  var done = doneCount(j.tasks), tot = j.tasks.length, pct = Math.round(done / tot * 100);

    '<button type="button" class="back" data-act="open" data-id="' + j.id + '">' + ic('chevL') + esc(j.place + ' · ' + j.unit) + '</button>' +
    '<div class="run-head"><div><h1 tabindex="-1" data-focus="main">Em curso</h1><p class="sub">Iniciada às ' + hhmm(j.startedAt) + '</p></div>' +
    (FEATURES.timer ? '<div class="timer" role="timer" aria-label="Tempo decorrido">' + ic('timer') + '<span data-timer="' + j.id + '">' + clockTxt(elapsed(j)) + '</span></div>' : '') + '</div>' +
    '<div class="progress" role="progressbar" aria-label="Tarefas concluídas" aria-valuemin="0" aria-valuemax="' + tot + '" aria-valuenow="' + done + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="progress-l">' + done + ' de ' + tot + ' concluídas</div>' +

    '</div>' +
    '<div class="actbar"><div class="actbar-in"><button type="button" class="btn btn-danger" data-act="issue" data-id="' + j.id + '">' + ic('alert') + 'Anomalia ou atraso</button>' +
    '<button type="button" class="btn btn-primary" data-act="finish" data-id="' + j.id + '">' + ic('checkc') + esc(A.finish) + '</button></div></div></div>';
}

/* ---------- Concluir ---------- */
function photoTile(p, i, jobId){

    (jobId ? '<button type="button" class="rm" data-act="ph-rm" data-id="' + jobId + '" data-ph="' + p.id + '" aria-label="Remover ' + esc(A.photoKinds[p.kind % 4]) + '">' + ic('x') + '</button>' : '') + '</div>';
}
function finishPane(j){
  var done = doneCount(j.tasks), tot = j.tasks.length;
  var missing = A.tasks.filter(function(t, i){ return !j.tasks[i]; });

      '<button type="button" class="back" style="margin:0" data-act="run" data-id="' + j.id + '">Rever</button></div>' : '') +
    '<h2 class="sec"><span>' + esc(A.evidence) + ' <span class="opt">(opcional)</span></span><small>' + j.photos.length + '</small></h2>' +

function sentPane(j){

    '<button type="button" class="btn btn-outline btn-block" style="margin-top:10px" data-act="to-list">Voltar a ' + esc(A.home) + '</button>' +

/* ---------- Plano, Mensagens, Perfil ---------- */
function planPane(){
  var ws = weekStart(UI.date);
  var h = '<div class="scroll" data-scroll="plan"><div class="pad"><h1 tabindex="-1" data-focus="plan">Plano da semana</h1><p class="sub">' + esc(ME.name) + '</p>' + weekStrip();
  for (var k = 0; k < 7; k++){
    var d = addDays(ws, k), items = dayItems(d);
    h += '<section class="plan-day"><h3 class="' + (d === TODAY ? 'today' : '') + '">' + esc(fmtDay(d)) + (d === TODAY ? ' · hoje' : '') + '</h3>';
    if (!items.length) h += '<p class="sub" style="margin:0;font-size:14px;color:var(--mute)">Dia livre</p>';
    items.forEach(function(j){
      var st = stOf(j);
      if (j.kind === 'absence'){ h += '<div class="prow st-absence"><span class="t">' + j.start + '</span><span class="sw"></span><span class="n"><b>Ausência</b><small>' + esc(j.reason) + '</small></span></div>'; return; }
      h += '<button type="button" class="prow st-' + st + '" data-act="open" data-id="' + j.id + '"><span class="t">' + j.start + '</span><span class="sw" aria-hidden="true"></span><span class="n"><b>' + esc(j.place + ' · ' + j.unit) + '</b><small>' + STATUS[st].label + ' · ' + durShort(j.start, j.end) + (j.issues.length ? ' · ⚠ aviso' : '') + '</small></span>' + ic('chevR') + '</button>';
    });
    h += '</section>';
  }
  return h + '</div></div>';
}
function msgPane(){
  return '<div class="scroll" data-scroll="msg"><div class="pad"><h1 tabindex="-1" data-focus="msg">Mensagens</h1><p class="sub">Da ' + esc(A.manager) + ' e da equipa</p>' +
    MSGS.map(function(m){ return '<article class="msg' + (m.unread ? ' unread' : '') + '"><header><b>' + esc(m.from) + ' · ' + esc(m.role) + '</b><span>' + m.day + ', ' + m.time + '</span></header><p>' + esc(m.text) + '</p></article>'; }).join('') +
    '<div class="notice info">' + ic('info') + '<span>Os avisos que registas ficam no histórico de cada ' + lo(A.job.s) + '. A ' + esc(A.manager) + ' vai consultá-los no Planeamento numa fase posterior.</span></div></div></div>';
}
function profilePane(){
  var q = [];
  D.forEach(function(j){ (j.events || []).forEach(function(e){ if (!e.synced) q.push({time:e.time, text:e.text, where:j.place}); }); });
  return '<div class="scroll" data-scroll="perfil"><div class="pad"><h1 tabindex="-1" data-focus="perfil">Perfil</h1>' +
    '<div class="prof"><span class="av">' + ME.initials + '</span><div><b style="font-size:17px">' + esc(ME.name) + '</b><p class="sub" style="margin:0">Equipa A · ' + esc(A.label) + '</p></div></div>' +
    '<div class="set"><div><span class="l"><b>Ligação à rede</b><small>Simulação: desliga para testar o modo sem rede.</small></span>' +
      '<button type="button" class="switch" role="switch" id="netSwitch" data-act="net-toggle" aria-checked="' + NET.online + '" aria-label="Ligação à rede"></button></div>' +
    '<div><span class="l"><b>Sincronização</b><small>' + (NET.syncing ? 'A sincronizar…' : q.length ? plural(q.length, 'registo por sincronizar', 'registos por sincronizar') : 'Tudo sincronizado · última às ' + UI.lastSync) + '</small></span>' + ic(q.length ? 'cloudOff' : 'checkc') + '</div>' +
    (q.length ? '<ol class="queue">' + q.map(function(x){ return '<li><time>' + x.time + '</time><span>' + esc(x.where) + ' · ' + esc(x.text) + '</span></li>'; }).join('') + '</ol>' : '') +
    '</div></div></div>';
}

/* =========================================================
   Render
   ========================================================= */
function render(opts){
  opts = opts || {};
  var active = document.activeElement, focusId = active && active.id && app.contains(active) ? active.id : null;
  var scrolls = {};
  $$('[data-scroll]', app).forEach(function(s){ scrolls[s.dataset.scroll] = s.scrollTop; });
  var j = UI.jobId ? byId(UI.jobId) : null;
  var body;
  if (UI.tab === 'hoje'){
    var main;
    if (UI.screen === 'list' || !j) main = '<div class="empty-main">' + '<div>' + ic('home') + '<p style="margin:0">Escolhe ' + (A.job.s === 'Intervenção' || A.job.s === 'Sessão' || A.job.s === 'Limpeza' ? 'uma' : 'um') + ' ' + lo(A.job.s) + ' para ver o detalhe.</p></div></div>';
    else if (UI.screen === 'detail') main = detailPane(j);
    else if (UI.screen === 'run') main = runPane(j);
    else if (UI.screen === 'finish') main = finishPane(j);
    else main = sentPane(j);
    body = '<div class="panes" data-screen="' + (j ? UI.screen : 'list') + '"><section class="pane list" aria-label="' + esc(A.home) + '">' + listPane() + '</section><section class="pane main" aria-label="Detalhe">' + main + '</section></div>';
  } else {
    body = '<div class="panes single"><section class="pane">' + (UI.tab === 'plano' ? planPane() : UI.tab === 'mensagens' ? msgPane() : profilePane()) + '</section></div>';
  }
  app.innerHTML = appbar() + body + tabbar();
  $$('[data-scroll]', app).forEach(function(s){
    var k = s.dataset.scroll;
    if (opts.resetMain && k === 'main') return;
    if (opts.resetAll) return;
    if (scrolls[k] != null) s.scrollTop = scrolls[k];
  });
  if (opts.focus){ var f = $('[data-focus="' + opts.focus + '"]', app); if (f) f.focus({preventScroll:true}); }
  else if (focusId){ var el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
  renderLayer();
}
function go(screen, jobId){
  UI.screen = screen; if (jobId) UI.jobId = jobId; UI.errNotes = false;
  if (screen === 'list') UI.jobId = null;
  var wide = device.clientWidth >= 720;
  render({resetMain:true, focus:screen === 'list' ? (wide ? null : 'list') : 'main'});
}

/* ---------- camada: folha de anomalia e modal ---------- */

  }
  if (keepToast) layer.appendChild(keepToast);
  if (activeInLayer && document.getElementById(activeInLayer)) document.getElementById(activeInLayer).focus({preventScroll:true});
}
function photoTileSheet(){
  return '<div class="ph k1" role="img" aria-label="Fotografia simulada">' + ic('image') + '<span>Foto</span><button type="button" class="rm" data-act="sheet-ph-rm" aria-label="Remover fotografia">' + ic('x') + '</button></div>';
}
function openSheet(jobId, type){
  UI.sheet = {jobId:jobId, type:type || 'atraso', delay:30, desc:'', photo:false, err:false};
  renderLayer();
  var first = $('#it-' + UI.sheet.type, layer); if (first) first.focus({preventScroll:true});
}
function closeLayer(){ UI.sheet = null; UI.modal = null; renderLayer(); }

/* =========================================================
   Ações
   ========================================================= */
function confirmRead(j){
  if (j.status !== 'planned') return;
  j.status = 'confirmed';
  addEvent(j, 'Leitura confirmada');
  render();
  var btnFocus = $('[data-act="open"][data-id="' + j.id + '"]', app); if (btnFocus && !document.activeElement.id) btnFocus.focus({preventScroll:true});
  saved('Leitura confirmada · ' + j.place + ' passou a Confirmado.');
}
function startJob(j){
  var other = inProgress();
  if (other && other.id !== j.id){
    UI.modal = {title:'Já tens ' + (A.job.s === 'Limpeza' ? 'uma limpeza' : 'uma ' + lo(A.job.s)) + ' em curso', text:other.place + ' · ' + other.unit + ' está em curso. Conclui-a antes de iniciar outra.', okLabel:'Abrir a que está em curso', ok:function(){ go('run', other.id); }};
    renderLayer(); var ok = $('#mOk', layer); if (ok) ok.focus();
    return;
  }
  if (j.status === 'planned') addEvent(j, 'Leitura confirmada');
  j.status = 'in_progress'; j.startedAt = now(); j.startedReal = Date.now();
  addEvent(j, A.job.s + ' iniciada');
  go('run', j.id);
  saved(A.job.s + ' iniciada · Em curso.');
}
function sendJob(j){
  var missing = j.tasks.filter(function(x){ return !x; }).length;
  if (missing && !j.notes.trim()){
    UI.errNotes = true; render();
    var ta = $('#notes', app); if (ta){ ta.scrollIntoView({block:'center'}); ta.focus({preventScroll:true}); }
    return;
  }
  if (j.qtyConf && !sameQty(j.qty, j.qtySaved)){
    var diff = qtyDiff(j);
    j.qtySaved = JSON.parse(JSON.stringify(j.qty));
    addEvent(j, A.qty.title + ': ' + (diff.length ? 'diferença registada (' + diff.join(', ') + ')' : 'quantidades confirmadas'));
  }
  j.durationSec = Math.max(60, Math.round(elapsed(j))); j.finishedAt = now(); j.status = 'done';
  if (j.notes.trim()) addEvent(j, 'Nota para a ' + A.manager + ': “' + j.notes.trim() + '”');
  addEvent(j, NET.online ? 'Conclusão enviada' : 'Conclusão guardada no telemóvel', 'ok');
  go('sent', j.id);
  toast(NET.online ? A.job.s + ' concluída e enviada à ' + A.manager + '.' : 'Conclusão guardada. Será enviada quando houver ligação.', !NET.online);
}
function setOnline(on){
  if (on === NET.online) return;
  NET.online = on;
  $$('#netSeg button').forEach(function(b){ b.setAttribute('aria-pressed', String((b.dataset.net === 'on') === on)); });
  if (!on){ render(); toast('Sem rede. Podes continuar: tudo fica guardado no telemóvel.', true); return; }
  var n = pendingAll();
  if (!n){ render(); toast('Ligação reposta.'); return; }
  NET.syncing = true; render();
  setTimeout(function(){
    D.forEach(function(j){ (j.events || []).forEach(function(e){ e.synced = true; }); (j.issues || []).forEach(function(i){ i.synced = true; }); });
    NET.syncing = false; UI.lastSync = hhmm(now()); render();
    toast(plural(n, 'registo sincronizado', 'registos sincronizados') + ' com a ' + A.manager + '.');
  }, 1600);
}

app.addEventListener('click', handleClick);
layer.addEventListener('click', handleClick);
function handleClick(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.dataset.act, j = el.dataset.id ? byId(el.dataset.id) : null;
  switch (act){
    case 'tab':
      if (el.dataset.tab === 'hoje' && UI.tab === 'hoje'){ UI.date = TODAY; go('list'); return; }
      UI.tab = el.dataset.tab;
      if (UI.tab === 'mensagens') setTimeout(function(){ MSGS.forEach(function(m){ m.unread = false; }); }, 1200);
      render({resetAll:true, focus:UI.tab === 'hoje' ? null : UI.tab === 'mensagens' ? 'msg' : UI.tab});
      return;
    case 'day': UI.date = el.dataset.date; if (UI.tab === 'hoje' && UI.jobId && byId(UI.jobId).date !== UI.date && device.clientWidth < 720){ UI.screen = 'list'; UI.jobId = null; } render(); return;
    case 'open':
      UI.tab = 'hoje'; UI.date = j.date;
      go(j.status === 'in_progress' && UI.screen !== 'run' && UI.screen !== 'detail' ? 'run' : 'detail', j.id); return;
    case 'to-list': go('list'); return;
    case 'confirm': e.stopPropagation(); confirmRead(j); return;
    case 'maps': toast('Abriria o Google Maps com “' + j.addr.join(', ') + '” (simulação).'); return;
    case 'start': startJob(j); return;
    case 'run': go('run', j.id); return;
    case 'finish': go('finish', j.id); return;
    case 'send': sendJob(j); return;
    case 'qty':
      var k = el.dataset.k; j.qty[k] = Math.max(0, j.qty[k] + +el.dataset.d); render(); return;
    case 'qty-save':
      var diff = qtyDiff(j);
      j.qtySaved = JSON.parse(JSON.stringify(j.qty));
      addEvent(j, A.qty.title + ': ' + (diff.length ? 'diferença registada (' + diff.join(', ') + ')' : 'quantidades confirmadas'));
      render(); var ok = $('.qty', app); if (ok) ok.closest('.pad').querySelector('.notice.ok') && ok.closest('.pad').querySelector('.notice.ok').setAttribute('tabindex', '-1');
      saved(diff.length ? 'Diferença registada: ' + diff.join(', ') + ' (simulação).' : 'Quantidades confirmadas.');
      return;
    case 'ph-add':
      j.photos.push({id:uid('ph'), kind:j.photos.length}); addEvent(j, 'Fotografia adicionada (' + A.photoKinds[(j.photos.length - 1) % 4] + ')'); render();
      saved('Fotografia adicionada (simulada).');
      return;
    case 'ph-rm':
      j.photos = j.photos.filter(function(p){ return p.id !== el.dataset.ph; }); render();
      var add = $('#addph', app); if (add) add.focus({preventScroll:true});
      toast('Fotografia removida.'); return;
    case 'issue': openSheet(j.id); return;
    case 'sheet-close': closeLayer(); return;
    case 'sheet-ph': UI.sheet.photo = true; renderLayer(); var rm = $('[data-act="sheet-ph-rm"]', layer); if (rm) rm.focus(); return;
    case 'sheet-ph-rm': UI.sheet.photo = false; renderLayer(); var ad = $('#shPh', layer); if (ad) ad.focus(); return;
    case 'issue-save':
      var s = UI.sheet, jj = byId(s.jobId);
      if (!s.desc.trim()){ s.err = true; renderLayer(); var ta = $('#idesc', layer); if (ta) ta.focus(); return; }
      jj.issues.push({id:uid('is'), type:s.type, delay:s.type === 'atraso' ? s.delay : null, desc:s.desc.trim(), photo:s.photo, time:hhmm(now()), synced:NET.online});
      addEvent(jj, (s.type === 'atraso' ? 'Atraso registado (' + (s.delay === 60 ? '1 hora ou mais' : s.delay + ' min') + ')' : 'Anomalia registada: ' + issueLabel(s.type)), 'bad');
      UI.sheet = null; render(); renderLayer();
      saved((s.type === 'atraso' ? 'Atraso registado' : 'Anomalia registada') + ' · a ' + A.manager + ' vai ver o aviso.');
      return;
    case 'modal-close': closeLayer(); return;
    case 'modal-ok': var fn = UI.modal.ok; UI.modal = null; renderLayer(); fn(); return;
    case 'net-toggle': setOnline(!NET.online); var sw = $('#netSwitch', app); if (sw) sw.focus({preventScroll:true}); return;
  }
}
app.addEventListener('change', function(e){
  var c = e.target.closest('[data-chk]'); if (!c) return;
  var j = byId(c.dataset.id), key = c.dataset.chk, i = +c.dataset.i;
  j[key][i] = c.checked;
  if (key === 'tasks' && j.status === 'in_progress'){
    var all = j.tasks.every(Boolean);
    render();
    if (c.checked && all) toast('Todas as tarefas concluídas. Podes ' + lo(A.finish) + '.');
  } else render();
});
app.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset.input === 'notes'){
    var j = byId(t.dataset.id); j.notes = t.value;
    if (UI.errNotes && t.value.trim()){ UI.errNotes = false; t.classList.remove('err'); t.removeAttribute('aria-invalid'); var er = $('#notesErr', app); if (er) er.remove(); }
  }
});
layer.addEventListener('change', function(e){
  var t = e.target; if (!UI.sheet) return;
  if (t.dataset.sheet === 'type'){ UI.sheet.type = t.value; renderLayer(); }
  if (t.dataset.sheet === 'delay'){ UI.sheet.delay = +t.value; }
});
layer.addEventListener('input', function(e){
  var t = e.target; if (!UI.sheet || t.dataset.sheet !== 'desc') return;
  UI.sheet.desc = t.value;
  if (UI.sheet.err && t.value.trim()){ UI.sheet.err = false; t.classList.remove('err'); var er = $('#idescErr', layer); if (er) er.remove(); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && (UI.sheet || UI.modal)){ closeLayer(); }
});

/* Cronómetro simulado */
setInterval(function(){
  $$('[data-timer]', app).forEach(function(el){ var j = byId(el.dataset.timer); if (j) el.textContent = clockTxt(elapsed(j)); });
}, 1000);

/* ---------- controlos da pré-visualização ---------- */
$('#appSel').addEventListener('change', function(e){
  A = APPS[e.target.value]; D = seed(); MSGS = messages();
  UI.tab = 'hoje'; UI.screen = 'list'; UI.jobId = null; UI.date = TODAY; UI.sheet = null; UI.modal = null;
  render({resetAll:true}); toast('Mesmo módulo com a terminologia de ' + A.label + '.');
});
$('#clockSel').addEventListener('change', function(e){ UI.clock = mins(e.target.value); UI.clockAt = Date.now(); render(); toast('Hora simulada: ' + e.target.value + '.'); });
$('#netSeg').addEventListener('click', function(e){ var b = e.target.closest('[data-net]'); if (b) setOnline(b.dataset.net === 'on'); });
$('#widthSeg').addEventListener('click', function(e){
  var b = e.target.closest('[data-w]'); if (!b) return;
  $$('#widthSeg button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
  $('#stage').dataset.w = b.dataset.w;
  setTimeout(render, 280);
});
$('#resetBtn').addEventListener('click', function(){
  D = seed(); MSGS = messages(); UI.tab = 'hoje'; UI.screen = 'list'; UI.jobId = null; UI.date = TODAY; UI.sheet = null; UI.modal = null; UI.errNotes = false;
  if (!NET.online){ NET.online = true; $$('#netSeg button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.net === 'on')); }); }
  render({resetAll:true}); toast('Dados de demonstração repostos.');
});

render();
})();
</script>
